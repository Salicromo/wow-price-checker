# ----------------------------------------------------------------------------
#  AJUSTES (los valores por defecto van bien; toca solo si sabes lo que haces)
# ----------------------------------------------------------------------------
settings:
  # Lo cambia el interruptor de avisos de la app (ver aplicar_avisos.py).
  # En pausa se sigue vigilando, pero no se envia nada a Discord.
  avisos_pausados: false
  # Si no se puede determinar el ilvl de una subasta, avisar igualmente cuando
  # el precio este por debajo del umbral MAS BARATO de ese objeto. La alerta
  # sale marcada como "ilvl sin confirmar".
  alert_on_unconfirmed_ilvl: true

  # Reinos escaneados a la vez. No lo subas a lo loco: cada reino en vuelo
  # mantiene en memoria toda su lista de subastas ya procesada, y en un reino
  # grande eso son cientos de MB. Con 8 el escaneo completo de EU tarda unos
  # pocos minutos, que es de sobra para un cron cada hora.
  max_workers: 8

  # Segundos de espera por peticion. Las subastas de un reino grande tardan.
  request_timeout: 45

  # Cuantas ejecuciones se recuerda una subasta ya avisada antes de olvidarla.
  # 72 = 3 dias con el cron cada hora, mas que la duracion maxima de una subasta.
  state_retention_runs: 72

  # Si falla mas de esta fraccion de reinos, el proceso termina con error y te
  # avisa por Discord (para que no te quedes sin alertas sin enterarte).
  failure_ratio_threshold: 0.30

  # --------------------------------------------------------------------------
  #  Cuando Blizzard publica el volcado tarde
  # --------------------------------------------------------------------------
  #  La casa de subastas se regenera una vez por hora y para toda la region a la
  #  vez. Si algun dia Blizzard se retrasa, la pasada se encontraria los datos de
  #  la hora anterior --ya vistos, sin nada nuevo-- y no habria otra oportunidad
  #  hasta la hora siguiente. En ese caso se espera y se vuelve a mirar.
  #
  #  Cada intento avisa por su cuenta, asi que un chollo que solo aparezca en
  #  el primero se envia igual.

  # A partir de que antiguedad se da por hecho que el volcado de esta hora
  # todavia no ha salido. Como se regenera cada hora, cualquier cosa por encima
  # de 60 delata un retraso.
  #
  # Esto NO depende del minuto al que publique Blizzard, y es a proposito: antes
  # habia aqui un "dump_minute: 31" y el 2026-09-02 resulto que habian pasado a
  # publicar a y 23, asi que cada pasada se creia tarde, dormia y reescaneaba los
  # 92 reinos dos veces de balde. Por antiguedad da igual el minuto que elijan.
  #
  # No lo subas buscando margen: cuanto mas cerca de la publicacion dispare el
  # cron, menos envejece el volcado viejo antes de que lo miremos, y un margen
  # de mas se lo traga por bueno y te deja sin alertas esa hora.
  max_dump_age_minutes: 61

  # Cuantas veces reintentar si el volcado de esta hora aun no ha salido.
  # 0 lo desactiva y la pasada se conforma con lo que haya.
  stale_retries: 2

  # Cuanto se vigila, como mucho, en cada intento.
  stale_retry_wait_seconds: 120

  # Cada cuanto se pregunta durante esa vigilancia. Preguntar la hora de
  # publicacion cuesta 0,4 s y unos pocos KB, porque se lee la cabecera de la
  # respuesta y se corta antes del cuerpo, asi que se puede mirar a menudo y
  # volver a escanear en cuanto aparece el volcado nuevo.
  dump_poll_seconds: 15

  # Cuanto se espera a un volcado que esta a punto de salir, en vez de procesar
  # el de la hora anterior.
  #
  # Esto tapa el agujero de disparar justo ANTES de la publicacion, que es lo
  # que pasa en cuanto Blizzard la mueve mas tarde: sin esto, cada pasada
  # avisaria de chollos de hace 54 minutos --que ya se ha llevado alguien-- y
  # asi hasta que el disparo se recolocase tres pasadas despues.
  #
  # Solo se aplica a las pasadas programadas, y solo cuando el siguiente volcado
  # cae dentro de estos minutos, asi que en marcha normal no espera nunca: el
  # volcado recien salido tiene 2 minutos y el siguiente esta a 58.
  espera_maxima_minutos: 12

  # --------------------------------------------------------------------------
  #  Horas en las que no quieres que suene nada
  # --------------------------------------------------------------------------
  #  Ventana en TU hora local (la zona de abajo). La de inicio entra y la de fin
  #  no: con 1 y 9, a las 09:00 ya suena. Poniendolas iguales no se silencia
  #  nada.
  #
  #  Solo se calla el ENVIO. Las pasadas siguen corriendo cada hora y el estado
  #  sigue actualizandose, porque el seguimiento de ventas necesita ver tus
  #  subastas hora tras hora: saltarse ocho pasadas seguidas degradaria las
  #  fechas de caducidad y se tragaria ventas de verdad.
  #
  #  Lo que se calla no se pierde:
  #    - Chollos y undercuts no se marcan como avisados, asi que al terminar la
  #      ventana se envia lo que siga vivo, que es lo unico accionable.
  #    - Las ventas se quedan pendientes y se deciden al despertar, con la hora
  #      en la que la subasta desaparecio de verdad, no con la de esa pasada.
  silencio_desde: 1
  silencio_hasta: 9

  # Zona en la que se leen esas horas. Las pasadas corren en GitHub Actions, con
  # el reloj en UTC, asi que sin esto la ventana se desplazaria sola en cada
  # cambio de hora.
  zona_horaria: "Europe/Madrid"

  # --------------------------------------------------------------------------
  #  Ventas de tus propias subastas
  # --------------------------------------------------------------------------
  # Comision que se queda la casa de subastas al vender algo. Es lo que separa
  # el precio al que publicas de lo que llega de verdad al buzon.
  ah_cut_pct: 5

  # Cuantas horas dejas puestas tus subastas. Ojo: aqui va la duracion MAS
  # CORTA que uses nunca, no la habitual.
  #
  # De este numero sale la deteccion de ventas. Si una subasta no estaba en el
  # volcado de las 14:31 y si en el de las 15:31, se publico entre esas dos
  # horas, asi que no puede caducar antes de las 02:31. Si desaparece antes, se
  # ha vendido: es imposible que haya caducado.
  #
  # Poner aqui mas horas de las reales convertiria caducaciones en ventas
  # falsas. Poner menos solo hace la deteccion mas floja, nunca incorrecta.
  listing_hours: 12
