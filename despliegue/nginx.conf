# Auction Sentinel - configuracion de nginx.
#
# Sustituye "auctionsentinel.example" por tu dominio real en las dos lineas
# de mas abajo (server_name) antes de instalar esto. Es el mismo valor que
# pones en BASE_URL en el .env (ver despliegue/README.md): si no coinciden,
# el sitemap.xml anuncia URLs de un dominio y nginx sirve otro.
#
# Instalacion: ver despliegue/README.md, apartado "nginx y certbot".

server {
    listen 80;
    listen [::]:80;
    server_name auctionsentinel.example;

    # Los ficheros estaticos (por ahora solo estilo.css) se sirven directo
    # desde disco, sin pasar por uvicorn. La ruta coincide con el mount de
    # web/app.py: app.mount("/estaticos", StaticFiles(directory=".../web/estaticos")).
    # Si cambias la raiz de instalacion (despliegue/README.md usa
    # /opt/auction-sentinel), cambia tambien este "alias" para que apunte a
    # <raiz>/web/estaticos/.
    location /estaticos/ {
        alias /opt/auction-sentinel/web/estaticos/;
        # El nombre del fichero no cambia entre despliegues -- no hay hash
        # de contenido en la URL -- asi que una cache larga es segura. Si
        # algun dia se versiona el nombre, esto se puede alargar mas todavia.
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # Todo lo demas (paginas de producto, de reino, sitemap.xml) va a
    # uvicorn, que ya escucha en 127.0.0.1:8000 (ver auction-sentinel.service).
    # El sitemap pone su propia cabecera Cache-Control de una hora desde
    # dentro de la app (web/app.py); no hace falta repetirla aqui.
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
